<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #313338; color: #dbdee1; padding: 20px; }
        #chat-box { width: 100%; height: 300px; background: #2b2d31; border: none; padding: 10px; overflow-y: scroll; margin-bottom: 10px; border-radius: 8px;}
        input, button { padding: 10px; font-size: 16px; border-radius: 4px; border: none; }
        input { width: 70%; background: #383a40; color: white; }
        button { background: #5865f2; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <h2>P2P Chat Prototype</h2>
    <div>
        <p>Your ID: <span id="my-id">Generating...</span></p>
        <input type="text" id="peer-id-input" placeholder="Enter Friend's Peer ID">
        <button id="connect-btn">Connect</button>
    </div>

    <hr>

    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
