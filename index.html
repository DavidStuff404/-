<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Discord Clone</title>
    <style>
        body { font-family: Arial, sans-serif; background: #313338; color: #dbdee1; padding: 20px; max-width: 800px; margin: 0 auto; }
        .panel { background: #2b2d31; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; font-size: 14px; }
        input { width: calc(100% - 22px); background: #1e1f22; color: white; }
        button { background: #5865f2; color: white; cursor: pointer; width: 100px; font-weight: bold; }
        button:hover { background: #4752c4; }
        #chat-box { height: 400px; overflow-y: scroll; padding: 10px; background: #1e1f22; border-radius: 8px; margin-bottom: 10px; }
        .message { display: flex; gap: 15px; margin-bottom: 15px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #5865f2; }
        .msg-header { font-weight: bold; margin-bottom: 5px; color: #fff; }
    </style>
</head>
<body>

    <div class="panel" id="setup-panel">
        <h3>1. Set Your Profile</h3>
        <input type="text" id="username" placeholder="Enter Username (e.g., Gamer123)">
        <input type="text" id="avatar" placeholder="Avatar Image URL (Optional)">
        
        <h3>2. Choose a Channel</h3>
        <input type="text" id="channel-name" placeholder="Channel Name (e.g., coding-chat)">
        <button id="create-btn">Create Channel</button>
        <button id="join-btn">Join Channel</button>
        <p id="status-text" style="color: #43b581;"></p>
    </div>

    <div class="panel">
        <div id="chat-box"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="message-input" placeholder="Type a message..." disabled style="flex-grow: 1; width: auto;">
            <button id="send-btn" disabled>Send</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
